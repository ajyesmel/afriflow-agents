services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////srv/data/afriflow.db
    volumes:
      - app_data:/srv/data
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////srv/data/afriflow.db
    volumes:
      - app_data:/srv/data
    restart: unless-stopped
volumes:
  app_data:
