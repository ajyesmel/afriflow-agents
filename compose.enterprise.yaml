# Installation privee : DB isolée, API loopback, un worker et LLM optionnel.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8001}:8000"
    env_file: .env.enterprise
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env.enterprise
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: afriflow
      POSTGRES_DB: afriflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a secret in .env.enterprise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afriflow -d afriflow"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
volumes:
  pgdata:
  ollama_models:
