[project]
name = "afriflow-agents"
version = "2.0.0"
description = "Multi-agent reporting, approval-gated actions and reliable scheduled automation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "pandas>=2,<3", "httpx>=0.27,<1", "pydantic>=2,<3", "python-dotenv>=1,<2", "langchain-core>=1.0,<2", "langgraph>=1.0,<2", "langchain-text-splitters>=1.0,<2"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["ui.html"]
